<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Q2 KB India titles evidence"><rect width="1200" height="700" fill="#0f1117"/><text x="40" y="60" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Q2 - KB returns India titles</text><rect x="40" y="95" width="1120" height="540" rx="18" fill="#151821" stroke="#334155"/><text x="75" y="145" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">Open WebUI chat with Netflix Shows KB collection attached</text><text x="75" y="200" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="22" font-weight="700">Input</text><text x="75" y="235" fill="#cbd5e1" font-family="Consolas, monospace" font-size="18">Return 3 Netflix title names from India that are found in the uploaded CSV.</text><text x="75" y="295" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="22" font-weight="700">Observed output</text><text x="95" y="335" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">1. Bombay Begums</text><text x="95" y="375" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">2. Fabulous Lives of Bollywood Wives</text><text x="95" y="415" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">3. Classic Legends</text><text x="75" y="475" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="22" font-weight="700">Proof</text><text x="75" y="515" fill="#22c55e" font-family="Arial, sans-serif" font-size="20">Retrieved 1 source from netflix_titles.csv.</text><text x="75" y="575" fill="#38bdf8" font-family="Arial, sans-serif" font-size="18">Validates KB retrieval from the uploaded CSV.</text></svg>