<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Open WebUI country tool config evidence"><rect width="1200" height="700" fill="#0f1117"/><text x="40" y="60" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Setup proof - Netflix Country Info tool</text><rect x="40" y="95" width="1120" height="540" rx="18" fill="#151821" stroke="#334155"/><text x="75" y="150" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22">Open WebUI path: Workspace to Tools</text><text x="75" y="205" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="22" font-weight="700">Tool configuration</text><text x="95" y="250" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Tool name: Netflix Country Info</text><text x="95" y="290" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Function: get_country_info(country)</text><text x="95" y="330" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Configured to call the local Flask server on port 5005.</text><text x="95" y="370" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Used successfully in Japan and Atlantis demo questions.</text><text x="75" y="450" fill="#22c55e" font-family="Arial, sans-serif" font-size="20">Validates that Open WebUI can call the local tool server.</text></svg>