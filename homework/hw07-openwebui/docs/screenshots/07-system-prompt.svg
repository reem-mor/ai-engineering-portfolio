<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Open WebUI system prompt evidence"><rect width="1200" height="700" fill="#0f1117"/><text x="40" y="60" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Setup proof - Netflix HW07 System Prompt</text><rect x="40" y="95" width="1120" height="540" rx="18" fill="#151821" stroke="#334155"/><text x="75" y="150" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22">Open WebUI path: Workspace -> Prompts</text><text x="75" y="205" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="22" font-weight="700">Prompt rules</text><text x="95" y="250" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Use the Knowledge Base for Netflix dataset questions.</text><text x="95" y="290" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Use the local country tool for currency, ISO code, phone code, and timezones.</text><text x="95" y="330" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Use both sources for combined questions.</text><text x="95" y="370" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Say clearly when the KB or tool does not have the answer.</text><text x="75" y="450" fill="#22c55e" font-family="Arial, sans-serif" font-size="20">Validates that the assistant routing instructions are configured.</text></svg>
